<div id="toast"></div>
<script>
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
async function writeClip(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e) {}
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); let ok=false; try { ok=document.execCommand('copy'); } catch(e) {}
  ta.remove(); return ok;
}
async function copyLink(url){ toast(await writeClip(url) ? '링크를 복사했습니다' : '복사하지 못했습니다'); }
async function copyText(id){ toast(await writeClip(document.getElementById(id).value) ? '텍스트를 복사했습니다' : '복사하지 못했습니다'); }
async function shareLink(url, btn){
  if (navigator.share) { try { await navigator.share({title: btn.dataset.title, url}); } catch(e) {} return; }
  copyLink(url);
}

</script>
